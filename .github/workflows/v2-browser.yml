name: V2 real browser verification
on:
  pull_request:
  push:
    branches:
      - 'feature/**'
      - 'repair/browser-verification'
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: npm install --prefix "$RUNNER_TEMP/laced-browser-deps" --no-package-lock playwright@1.58.2 axe-core@4.10.3
      - name: Install Chromium and WebKit
        run: |
          "$RUNNER_TEMP/laced-browser-deps/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Existing data regressions
        run: node --test tests/v2-smoke.test.cjs
      - name: Real browser verification
        env:
          NODE_PATH: ${{ runner.temp }}/laced-browser-deps/node_modules
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/laced-browser-evidence
        run: node tests/v2-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laced-browser-evidence
          path: ${{ runner.temp }}/laced-browser-evidence
          retention-days: 14
